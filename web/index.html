<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鱼群模拟 · Boids (WebGL)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box;
      -webkit-user-select: none; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #040a14;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #cfe6ff;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .hud {
    position: fixed; left: 22px; bottom: 20px;
    font-size: 13px; line-height: 1.9; letter-spacing: .3px;
    color: #7fb4e8; text-shadow: 0 0 12px rgba(80,170,255,.35);
    pointer-events: none; user-select: none;
  }
  .hud b { color: #a9d4ff; font-weight: 600; }
  .title {
    position: fixed; left: 22px; top: 18px;
    font-size: 15px; font-weight: 600; letter-spacing: 4px;
    color: #9fc8f0; opacity: .85; text-shadow: 0 0 16px rgba(90,180,255,.4);
    pointer-events: none; user-select: none;
  }
  .title small { display: block; font-size: 11px; letter-spacing: 1px; opacity: .5; margin-top: 4px; font-weight: 400; }
  .diag {
    position: fixed; left: 22px; top: 66px;
    font-size: 11px; line-height: 1.8; color: #6aa8dd;
    font-variant-numeric: tabular-nums; letter-spacing: .3px;
    white-space: nowrap;
    opacity: .85; pointer-events: none; user-select: none;
  }
  .diag b { color: #a9d4ff; font-weight: 600; }
  #pause {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(.92);
    padding: 10px 26px; border-radius: 999px;
    font-size: 14px; letter-spacing: 6px; color: #bfe0ff;
    background: rgba(10,40,70,.4);
    border: 1px solid rgba(120,190,255,.25);
    backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none; user-select: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  body.paused #pause { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .panel, .hud, .title, .diag { transition: opacity .2s ease; }
  body.ui-min .panel,
  body.ui-min .hud,
  body.ui-min #pause { opacity: 0; pointer-events: none; }
  body.ui-hidden .panel,
  body.ui-hidden .hud,
  body.ui-hidden .title,
  body.ui-hidden .diag,
  body.ui-hidden #pause { opacity: 0; pointer-events: none; }
  .panel {
    position: fixed; right: 20px; top: 18px;
    display: flex; flex-direction: column; gap: 10px;
    background: rgba(10,40,70,.35);
    border: 1px solid rgba(90,160,240,.18);
    border-radius: 14px; padding: 14px 16px;
    backdrop-filter: blur(8px);
    font-size: 12px; width: 190px;
    max-height: calc(100vh - 36px); overflow-y: auto;
  }
  .panel label { display: flex; flex-direction: column; gap: 5px; color: #8fbbe6; }
  .panel label.chk {
    flex-direction: row; align-items: center; gap: 8px;
    color: #a9d4ff; cursor: pointer;
  }
  .panel label.chk input { accent-color: #4da3ff; width: 14px; height: 14px; cursor: pointer; }
  .panel input[type=range] { width: 100%; accent-color: #4da3ff; cursor: pointer; height: 3px; }
  .panel .val { float: right; color: #cfe6ff; }
  .panel .row { display: flex; justify-content: space-between; color: #8fbbe6; cursor: move; }
  .panel .divider {
    display: flex; align-items: center; gap: 8px;
    margin-top: 2px; font-size: 10px; letter-spacing: 2px; color: #6d9cc8;
  }
  .panel .divider::before, .panel .divider::after {
    content: ""; flex: 1; height: 1px; background: rgba(90,160,240,.2);
  }
  .panel.paint { right: auto; left: 22px; top: 150px; }
  .panel input[type=color] {
    width: 100%; height: 26px; padding: 0; cursor: pointer;
    border: 1px solid rgba(90,160,240,.3); border-radius: 6px;
    background: transparent;
  }
  .panel.sites { right: auto; left: 230px; top: 150px; }
  .panel.p-flock { right: 20px; top: 18px; }
  .panel.p-scatter { right: 20px; top: 400px; }
  .panel.p-mouse { right: 230px; top: 18px; }
  .panel.p-view { right: 230px; top: 270px; }
  .panel.p-save { right: 230px; top: 500px; }
  #siteEdit { display: flex; flex-direction: column; gap: 10px; }
  .panel .btn {
    width: 100%; padding: 6px 8px; cursor: pointer;
    font: inherit; font-size: 12px; color: #cfe6ff;
    background: rgba(40,90,150,.35); border: 1px solid rgba(120,190,255,.3);
    border-radius: 8px;
  }
  .panel .btn:hover { background: rgba(60,120,190,.45); }
  .panel .btn.active { background: rgba(70,150,110,.55); border-color: rgba(140,240,180,.55); color: #eafff4; }
  .panel .pin {
    position: absolute; top: 5px; right: 7px;
    width: 22px; height: 22px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; line-height: 1; cursor: pointer; color: #7fb4e8;
    background: transparent; border: 1px solid rgba(120,190,255,.25); border-radius: 6px;
  }
  .panel .pin:hover { background: rgba(60,120,190,.4); color: #cfe6ff; }
  .panel.pinned .pin { background: rgba(70,150,110,.55); border-color: rgba(140,240,180,.6); color: #eafff4; }
  body.ui-min .panel.pinned, body.ui-hidden .panel.pinned { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="title">鱼群模拟<small>BOIDS FLOCKING · WEBGL</small></div>
<div class="diag" id="diag"></div>
<div id="pause">已暂停</div>

<div class="panel p-flock">
  <div class="row"><span>鱼群</span></div>
  <div class="row"><span>数量</span><span class="val" id="vCount">180</span></div>
  <input type="range" id="sCount" min="0" max="1000" step="1" value="242">
  <label>凝聚力 <span class="val" id="vCohesion"></span>
    <input type="range" id="sCohesion" min="0" max="2" step="0.01" value="0.55"></label>
  <label>分离力 <span class="val" id="vSeparation"></span>
    <input type="range" id="sSeparation" min="0" max="3" step="0.01" value="1.4"></label>
  <label>对齐力 <span class="val" id="vAlign"></span>
    <input type="range" id="sAlign" min="0" max="2" step="0.01" value="1.0"></label>
  <label>速度 <span class="val" id="vSpeed"></span>
    <input type="range" id="sSpeed" min="0.4" max="8" step="0.05" value="1.4"></label>
  <label>扰动 <span class="val" id="vWander"></span>
    <input type="range" id="sWander" min="0" max="5" step="0.05" value="1"></label>
</div>

<div class="panel p-mouse">
  <div class="row"><span>鼠标力场</span></div>
  <label class="chk"><input type="checkbox" id="cbMouse"> 启用鼠标力场</label>
  <label>吸引力 <span class="val" id="vMAttract"></span>
    <input type="range" id="sMAttract" min="0" max="2" step="0.01" value="0.5"></label>
  <label>排斥力 <span class="val" id="vMRepel"></span>
    <input type="range" id="sMRepel" min="0" max="3" step="0.01" value="0.8"></label>
  <label>影响半径 <span class="val" id="vMRadius"></span>
    <input type="range" id="sMRadius" min="80" max="600" step="1" value="320"></label>
</div>

<div class="panel p-scatter">
  <div class="row"><span>驱散</span></div>
  <label>驱散强度 <span class="val" id="vScatter"></span>
    <input type="range" id="sScatter" min="0" max="4" step="0.05" value="1.5"></label>
  <label>驱散半径 <span class="val" id="vScatterR"></span>
    <input type="range" id="sScatterR" min="0" max="1000" step="1" value="406"></label>
</div>

<div class="panel p-view">
  <div class="row"><span>视图</span></div>
  <label>缩放 <span class="val" id="vZoom"></span>
    <input type="range" id="sZoom" min="0" max="1000" step="1" value="812"></label>
  <div class="divider"><span>边界</span></div>
  <label class="chk"><input type="checkbox" id="cbWrap" checked> 循环边界（环绕）</label>
  <div class="divider"><span>放大镜（中键）</span></div>
  <label>放大倍数 <span class="val" id="vMag"></span>
    <input type="range" id="sMag" min="1.5" max="8" step="0.1" value="3"></label>
  <label>镜圈大小 <span class="val" id="vMagR"></span>
    <input type="range" id="sMagR" min="50" max="220" step="1" value="96"></label>
</div>

<div class="panel p-save">
  <div class="row"><span>保存和恢复</span></div>
  <button id="btnSave" class="btn">保存（下载 JSON）</button>
  <button id="btnLoad" class="btn">恢复（载入 JSON）</button>
  <input type="file" id="loadFile" accept="application/json,.json" style="display:none">
</div>

<div class="hud">
  <div>移动鼠标 → 蓝色力场吸引鱼群，内圈橙色排斥</div>
  <div><b>中键</b> 放大镜 · <b>左键</b> 按住驱散 · <b>空格</b> 暂停 · <b>R</b> 打乱 · <b>W/S</b> 倍速 · <b>F1</b> 界面</div>
</div>

<div class="panel paint">
  <div class="row"><span>鱼群着色</span></div>
  <label class="chk"><input type="checkbox" id="cbPaint"> 启用画笔</label>
  <label>颜色 <input type="color" id="paintColor" value="#ff6a3c"></label>
  <label>画笔大小 <span class="val" id="vBrush"></span>
    <input type="range" id="sBrush" min="10" max="400" step="1" value="80"></label>
  <div class="divider"><span>一键着色</span></div>
  <button id="btnBlue" class="btn">纯蓝色</button>
  <button id="btnRandDefault" class="btn">默认随机</button>
  <button id="btnRandRich" class="btn">丰富随机</button>
</div>

<div class="panel sites">
  <div class="row"><span>驱散点</span></div>
  <label>新点半径 <span class="val" id="vDefR"></span>
    <input type="range" id="sDefR" min="0" max="1000" step="1" value="406"></label>
  <label>新点强度 <span class="val" id="vDefS"></span>
    <input type="range" id="sDefS" min="0" max="4" step="0.05" value="1.5"></label>
  <label class="chk"><input type="checkbox" id="cbShowAllR"> 显示所有半径</label>
  <button id="btnAddSite" class="btn">＋ 添加驱散点</button>
  <div id="siteEdit" style="display:none">
    <div class="divider"><span>编辑选中点</span></div>
    <label>半径 <span class="val" id="vSiteR"></span>
      <input type="range" id="sSiteR" min="0" max="1000" step="1" value="406"></label>
    <label>强度 <span class="val" id="vSiteS"></span>
      <input type="range" id="sSiteS" min="0" max="4" step="0.05" value="1.5"></label>
    <button id="btnDelSite" class="btn">删除此点</button>
  </div>
</div>

<script>
(function () {
'use strict';

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
const diagEl = document.getElementById('diag');
if (!gl) { diagEl.textContent = '需要 WebGL2 支持'; return; }

let W, H, dpr;

/* ---------------- 参数 ---------------- */
const params = {
  count: 180,
  cohesion: 0.55,
  separation: 1.4,
  align: 1.0,
  speed: 1.4,
  wander: 1.0,
  mAttract: 0.5,
  mRepel: 0.8,
  mRadius: 320,
  scatterForce: 1.5,
  scatterRadius: 260,
  mouseField: false,
  zoom: 1,
  magZoom: 3,
  magRadius: 96,
  wrap: true
};

const PERCEPTION = 60;
const SEP_RADIUS = 22;
const MOUSE_REPEL_RADIUS = 70;
const EDGE_ZONE = 80;
const REF_TICKS = 60;              // 积分基准：dt = 1/60 时步长倍率 N = 1
const MAX_DT = 0.1;                // 单 tick 最大积分时长（秒），防卡顿大跳
const MAX_FISH = 50000;
const BG = [4 / 255, 10 / 255, 20 / 255];
const FADE_ALPHA = 0.22;

/* 边界跟随视图 */
const bounds = { left: 0, top: 0, right: 0, bottom: 0 };
function updateBounds() {
  const hw = W / (2 * params.zoom);
  const hh = H / (2 * params.zoom);
  bounds.left = W / 2 - hw;
  bounds.right = W / 2 + hw;
  bounds.top = H / 2 - hh;
  bounds.bottom = H / 2 + hh;
}

/* ---------------- 鱼 ---------------- */
class Fish {
  constructor() { this.reset(); }
  reset() {
    this.x = bounds.left + Math.random() * (bounds.right - bounds.left);
    this.y = bounds.top + Math.random() * (bounds.bottom - bounds.top);
    const a = Math.random() * Math.PI * 2;
    this.vx = Math.cos(a) * params.speed;
    this.vy = Math.sin(a) * params.speed;
    this.size = 4 + Math.random() * 3.5;
    this.hue = 185 + Math.random() * 55;
    this.phase = Math.random() * Math.PI * 2;
    this.wander = Math.random() * Math.PI * 2;
  }
  edges(nstep) {
    const e = EDGE_ZONE / params.zoom, k = 0.5 * nstep;
    if (this.x < bounds.left + e)   this.vx += (1 - (this.x - bounds.left) / e) * k;
    if (this.x > bounds.right - e)  this.vx -= (1 - (bounds.right - this.x) / e) * k;
    if (this.y < bounds.top + e)    this.vy += (1 - (this.y - bounds.top) / e) * k;
    if (this.y > bounds.bottom - e) this.vy -= (1 - (bounds.bottom - this.y) / e) * k;
    if (this.x < bounds.left)   this.x = bounds.left;
    if (this.x > bounds.right)  this.x = bounds.right;
    if (this.y < bounds.top)    this.y = bounds.top;
    if (this.y > bounds.bottom) this.y = bounds.bottom;
  }
}

let fishes = [];
function spawn(n) {
  fishes = [];
  for (let i = 0; i < n; i++) fishes.push(new Fish());
}

/* ---------------- 交互状态 ---------------- */
const mouse = { x: -9999, y: -9999, sx: -9999, sy: -9999, active: false, leftDown: false };
function screenToWorld(sx, sy) {
  const z = params.zoom;
  return { x: (sx - W / 2) / z + W / 2, y: (sy - H / 2) / z + H / 2 };
}
const mag = { active: false };
const paint = { enabled: false, hue: 20, radius: 80 };  // 画笔：色相 + 半径
const scatterPts = [];     // 场景驱散点：{ x, y, r, s }（世界坐标）
let selectedSite = -1;     // 当前选中的驱散点索引
let dragSite = -1, dragOffX = 0, dragOffY = 0;   // 正在拖动的点
let placeSite = false;     // 放置模式
let showAllRadii = false;  // 是否显示所有点的半径圈
let paused = false;
let uiMode = 0;   // 0 全显示 / 1 只留左上性能 / 2 全隐藏
const SPEEDS = [0.1, 0.25, 0.5, 1, 2, 3, 5, 8, 16];
let speedIdx = 3;                 // 指向 1.0×
let speedMul = SPEEDS[speedIdx];  // 倍速：只缩放传进 tick 的 dt
let simTime = 0;                  // 逻辑(模拟)时间累积（秒）

window.addEventListener('mousemove', e => {
  if (dragPanel) {                                       // 拖动面板（卡片）
    dragPanel.el.style.left = (e.clientX - dragPanel.offX) + 'px';
    dragPanel.el.style.top = (e.clientY - dragPanel.offY) + 'px';
    return;
  }
  if (dragSite >= 0 && dragSite < scatterPts.length) {   // 拖动驱散点
    const w = screenToWorld(e.clientX, e.clientY);
    scatterPts[dragSite].x = w.x + dragOffX; scatterPts[dragSite].y = w.y + dragOffY;
    return;
  }
  if (e.target !== canvas) { mouse.active = false; return; }   // 落在 UI 上的移动不驱动画布
  mouse.sx = e.clientX; mouse.sy = e.clientY;
  const w = screenToWorld(e.clientX, e.clientY);
  mouse.x = w.x; mouse.y = w.y; mouse.active = true;
});
window.addEventListener('mouseleave', () => { mouse.active = false; mouse.leftDown = false; mag.active = false; dragSite = -1; });
// —— 驱散点：放置 / 选中 / 编辑 ——
function siteRadius() {
  const t = parseFloat(document.getElementById('sSiteR').value) / 1000;
  return SR_MIN * Math.pow(SR_RATIO, t);
}
function siteStrength() { return parseFloat(document.getElementById('sSiteS').value); }
function defRadius() {
  const t = parseFloat(document.getElementById('sDefR').value) / 1000;
  return SR_MIN * Math.pow(SR_RATIO, t);
}
function defStrength() { return parseFloat(document.getElementById('sDefS').value); }
function hitSite(sx, sy) {
  const z = params.zoom;
  for (let i = scatterPts.length - 1; i >= 0; i--) {
    const p = scatterPts[i];
    const px = W / 2 + (p.x - W / 2) * z, py = H / 2 + (p.y - H / 2) * z;
    if (Math.hypot(sx - px, sy - py) <= 12) return i;   // 只认中心小圈
  }
  return -1;
}
function setPlaceMode(on) {
  placeSite = on;
  const b = document.getElementById('btnAddSite');
  b.classList.toggle('active', on);
  b.textContent = on ? '点击场景放置…' : '＋ 添加驱散点';
  canvas.style.cursor = on ? 'crosshair' : '';
}
function syncSiteEditor() {
  const ed = document.getElementById('siteEdit');
  const sR = document.getElementById('sSiteR'), vR = document.getElementById('vSiteR');
  const sS = document.getElementById('sSiteS'), vS = document.getElementById('vSiteS');
  if (selectedSite >= 0 && selectedSite < scatterPts.length) {
    const p = scatterPts[selectedSite];
    ed.style.display = '';
    sR.value = Math.round(1000 * Math.log(p.r / SR_MIN) / Math.log(SR_RATIO));
    vR.textContent = Math.round(p.r);
    sS.value = p.s;
    vS.textContent = (+p.s).toFixed(2);
  } else {
    ed.style.display = 'none';
  }
}
window.addEventListener('mousedown', e => {
  if (e.target !== canvas) return;   // 落在 UI 上的按下不驱动画布
  if (e.button === 0) {
    if (placeSite) {                 // 放置模式：落点放一个驱散点
      const w = screenToWorld(e.clientX, e.clientY);
      scatterPts.push({ x: w.x, y: w.y, r: defRadius(), s: defStrength() });
      selectedSite = scatterPts.length - 1;
      setPlaceMode(false);
      syncSiteEditor();
      return;
    }
    const hit = hitSite(e.clientX, e.clientY);
    if (hit >= 0) {                 // 点中驱散点：选中并开始拖动，不驱散/画笔
      selectedSite = hit; syncSiteEditor();
      const w = screenToWorld(e.clientX, e.clientY);
      dragSite = hit; dragOffX = scatterPts[hit].x - w.x; dragOffY = scatterPts[hit].y - w.y;
      return;
    }
    if (selectedSite >= 0) { selectedSite = -1; syncSiteEditor(); }
    mouse.leftDown = true; mouse.sx = e.clientX; mouse.sy = e.clientY; mouse.active = true;
  } else if (e.button === 1) {
    mag.active = true; mouse.sx = e.clientX; mouse.sy = e.clientY; e.preventDefault();
  }
});
window.addEventListener('mouseup', e => {
  // 释放始终处理，避免在画布外松手后按住状态卡住
  dragPanel = null;
  if (e.button === 0) { mouse.leftDown = false; dragSite = -1; }
  else if (e.button === 1) mag.active = false;
});
window.addEventListener('auxclick', e => { if (e.button === 1) e.preventDefault(); });

// 面板（卡片）可拖动：按住面板空白/标题行拖动，控件上不拖
let dragPanel = null, zCounter = 10;
document.querySelectorAll('.panel').forEach(panel => {
  const pin = document.createElement('button');   // 固定显示按钮（右上角）
  pin.className = 'pin'; pin.type = 'button'; pin.tabIndex = -1; pin.textContent = '🔓';
  pin.title = '固定显示（隐藏界面时也保留）';
  pin.addEventListener('click', () => { panel.classList.toggle('pinned'); pin.textContent = panel.classList.contains('pinned') ? '🔒' : '🔓'; });
  panel.appendChild(pin);
  panel.addEventListener('mousedown', e => {
    panel.style.zIndex = ++zCounter;   // 点到哪张卡，哪张置顶
    if (e.button !== 0) return;
    if (e.target.closest('input, button, select, textarea, label, a')) return;   // 落在控件上不拖
    e.preventDefault();
    const r = panel.getBoundingClientRect();
    dragPanel = { el: panel, offX: e.clientX - r.left, offY: e.clientY - r.top };
    panel.style.right = 'auto';
    panel.style.left = r.left + 'px';
    panel.style.top = r.top + 'px';
  });
});
window.addEventListener('keydown', e => {
  if (e.code === 'F1') {                 // F1：全显示 → 只留左上性能 → 全隐藏 循环
    uiMode = (uiMode + 1) % 3;
    document.body.classList.toggle('ui-min', uiMode === 1);
    document.body.classList.toggle('ui-hidden', uiMode === 2);
    e.preventDefault();
    return;
  }
  if (e.target && e.target.tagName === 'INPUT') return;   // 焦点在 UI 控件上时不触发画布快捷键
  if (e.code === 'Space') {
    paused = !paused;
    document.body.classList.toggle('paused', paused);
    e.preventDefault();
  } else if (e.code === 'KeyR') {
    // 只打乱鱼的位置，保留颜色等其它属性
    const w = bounds.right - bounds.left, h = bounds.bottom - bounds.top;
    for (const f of fishes) { f.x = bounds.left + Math.random() * w; f.y = bounds.top + Math.random() * h; }
  } else if (e.code === 'KeyW') {
    speedIdx = Math.min(speedIdx + 1, SPEEDS.length - 1);
    speedMul = SPEEDS[speedIdx];
  } else if (e.code === 'KeyS') {
    speedIdx = Math.max(speedIdx - 1, 0);
    speedMul = SPEEDS[speedIdx];
  }

/* ---------------- 模拟 ---------------- */
const neighborGrid = new Map();
const CELL_SIZE = PERCEPTION;

function update(dt) {
  const total = fishes.length;
  const N = dt * REF_TICKS;   // 以 60 tick/s 为基准的步长倍率（dt = 1/60 时 N = 1）
  const wrap = params.wrap;
  const wW = bounds.right - bounds.left;
  const wH = bounds.bottom - bounds.top;
  const halfW = wW * 0.5, halfH = wH * 0.5;

  // 网格：循环模式下把格子规整到 [0,cols)×[0,rows)，邻格按模取
  let cols = 0, rows = 0, cw = CELL_SIZE, ch = CELL_SIZE;
  if (wrap) {
    cols = Math.max(3, Math.floor(wW / CELL_SIZE));
    rows = Math.max(3, Math.floor(wH / CELL_SIZE));
    cw = wW / cols; ch = wH / rows;
  }

  for (const bucket of neighborGrid.values()) bucket.length = 0;
  for (let i = 0; i < total; i++) {
    const f = fishes[i];
    let gx, gy;
    if (wrap) {
      gx = Math.floor((f.x - bounds.left) / cw);
      gy = Math.floor((f.y - bounds.top) / ch);
      gx = ((gx % cols) + cols) % cols;
      gy = ((gy % rows) + rows) % rows;
    } else {
      gx = Math.floor(f.x / CELL_SIZE);
      gy = Math.floor(f.y / CELL_SIZE);
    }
    f.gx = gx; f.gy = gy;
    const key = gx * 100000 + gy;
    let bucket = neighborGrid.get(key);
    if (bucket === undefined) { bucket = []; neighborGrid.set(key, bucket); }
    bucket.push(i);
  }

  for (let i = 0; i < total; i++) {
    const f = fishes[i];
    let cdx = 0, cdy = 0, ax = 0, ay = 0, sdx = 0, sdy = 0;
    let n = 0, sn = 0;

    for (let ox = -1; ox <= 1; ox++) {
      for (let oy = -1; oy <= 1; oy++) {
        let key;
        if (wrap) {
          const nx = ((f.gx + ox) % cols + cols) % cols;
          const ny = ((f.gy + oy) % rows + rows) % rows;
          key = nx * 100000 + ny;
        } else {
          key = (f.gx + ox) * 100000 + (f.gy + oy);
        }
        const bucket = neighborGrid.get(key);
        if (bucket === undefined) continue;
        for (let b = 0; b < bucket.length; b++) {
          const j = bucket[b];
          if (j === i) continue;
          const o = fishes[j];
          let dx = o.x - f.x, dy = o.y - f.y;
          if (wrap) {
            // 最小镜像（跨边界 & 跨对角边界都靠这个修正）
            if (dx > halfW) dx -= wW; else if (dx < -halfW) dx += wW;
            if (dy > halfH) dy -= wH; else if (dy < -halfH) dy += wH;
          }
          const d2 = dx * dx + dy * dy;
          if (d2 > 0 && d2 < PERCEPTION * PERCEPTION) {
            cdx += dx; cdy += dy;          // 用镜像偏移求质心偏移
            ax += o.vx; ay += o.vy;
            n++;
            if (d2 < SEP_RADIUS * SEP_RADIUS) { const w = 1 - d2 / (SEP_RADIUS * SEP_RADIUS); sdx -= dx * w; sdy -= dy * w; sn++; }   // 越近越强
          }
        }
      }
    }

    let accx = 0, accy = 0;
    if (n > 0) {
      const tx = cdx / n, ty = cdy / n;    // 指向邻居质心的平均偏移
      const td = Math.hypot(tx, ty) || 1;
      accx += (tx / td) * params.cohesion * 0.32;
      accy += (ty / td) * params.cohesion * 0.32;
      const avx = ax / n, avy = ay / n;
      const ad = Math.hypot(avx, avy) || 1;
      accx += (avx / ad) * params.align * 0.10;
      accy += (avy / ad) * params.align * 0.10;
    }
    if (sn > 0) {
      const sd = Math.hypot(sdx, sdy) || 1;
      accx += (sdx / sd) * params.separation * 0.35;
      accy += (sdy / sd) * params.separation * 0.35;
    }

    f.wander += (Math.random() - 0.5) * 0.5 * N;
    accx += Math.cos(f.wander) * 0.02 * params.wander;
    accy += Math.sin(f.wander) * 0.02 * params.wander;

    if (mouse.active && params.mouseField) {
      let dx = mouse.x - f.x, dy = mouse.y - f.y;
      if (wrap) {
        if (dx > halfW) dx -= wW; else if (dx < -halfW) dx += wW;
        if (dy > halfH) dy -= wH; else if (dy < -halfH) dy += wH;
      }
      const d = Math.hypot(dx, dy) || 1;
      if (d < params.mRadius) {
        const pull = (1 - d / params.mRadius) * params.mAttract;
        accx += (dx / d) * pull;
        accy += (dy / d) * pull;
      }
      if (d < MOUSE_REPEL_RADIUS) {
        const push = (1 - d / MOUSE_REPEL_RADIUS) * params.mRepel;
        accx -= (dx / d) * push;
        accy -= (dy / d) * push;
      }
    }

    // 按住左键：持续驱散（不受鼠标力场开关影响；画笔模式下让位给着色）
    if (mouse.leftDown && !paint.enabled) {
      let dx = f.x - mouse.x, dy = f.y - mouse.y;
      if (wrap) {
        if (dx > halfW) dx -= wW; else if (dx < -halfW) dx += wW;
        if (dy > halfH) dy -= wH; else if (dy < -halfH) dy += wH;
      }
      const d = Math.hypot(dx, dy) || 1;
      const p = Math.max(0, 1 - d / params.scatterRadius);
      accx += (dx / d) * p * params.scatterForce;
      accy += (dy / d) * p * params.scatterForce;
    }

    // 场景驱散点：范围内线性排斥
    for (let si = 0; si < scatterPts.length; si++) {
      const sp = scatterPts[si];
      if (sp.r <= 0) continue;
      let dx = f.x - sp.x, dy = f.y - sp.y;
      if (wrap) {
        if (dx > halfW) dx -= wW; else if (dx < -halfW) dx += wW;
        if (dy > halfH) dy -= wH; else if (dy < -halfH) dy += wH;
      }
      const d = Math.hypot(dx, dy) || 1;
      if (d < sp.r) { const pp = (1 - d / sp.r) * sp.s; accx += (dx / d) * pp; accy += (dy / d) * pp; }
    }

    accx *= N;
    accy *= N;
    f.vx += accx;
    f.vy += accy;
    if (!wrap) f.edges(N);   // 循环模式不做软边界推挤

    const sp = Math.hypot(f.vx, f.vy) || 1;
    const damp = Math.pow(0.94, N);
    const newSp = params.speed + (sp - params.speed) * damp;
    f.vx = (f.vx / sp) * newSp;
    f.vy = (f.vy / sp) * newSp;

    f.phase += (0.3 + sp * 0.05) * N;

    f.x += f.vx * N;
    f.y += f.vy * N;

    if (wrap) {
      // 位置环绕
      f.x = bounds.left + ((((f.x - bounds.left) % wW) + wW) % wW);
      f.y = bounds.top + ((((f.y - bounds.top) % wH) + wH) % wH);
    }
  }
}

/* 画笔着色：把光标范围内鱼的色相改成画笔色相 */
function applyPaint() {
  if (!paint.enabled || !mouse.leftDown || mag.active) return;
  const wrap = params.wrap;
  const wW = bounds.right - bounds.left, wH = bounds.bottom - bounds.top;
  const halfW = wW * 0.5, halfH = wH * 0.5;
  const r2 = paint.radius * paint.radius;
  for (let i = 0; i < fishes.length; i++) {
    const f = fishes[i];
    let dx = f.x - mouse.x, dy = f.y - mouse.y;
    if (wrap) {
      if (dx > halfW) dx -= wW; else if (dx < -halfW) dx += wW;
      if (dy > halfH) dy -= wH; else if (dy < -halfH) dy += wH;
    }
    if (dx * dx + dy * dy <= r2) f.hue = paint.hue;
  }
}

const FISH_FS = `#version 300 es

vec3 hsl2rgb(float h, float s, float l){
  float c = (1.0 - abs(2.0*l - 1.0)) * s;
  float hp = mod(h, 360.0) / 60.0;
  float x = c * (1.0 - abs(mod(hp, 2.0) - 1.0));
  vec3 rgb;
  if (hp < 1.0) rgb = vec3(c,x,0.0);
  else if (hp < 2.0) rgb = vec3(x,c,0.0);
  else if (hp < 3.0) rgb = vec3(0.0,c,x);
  else if (hp < 4.0) rgb = vec3(0.0,x,c);
  else if (hp < 5.0) rgb = vec3(x,0.0,c);

  bool inside = false;
  for (int i = 0; i < 8; i++){
    int j = (i == 0) ? 7 : i - 1;
    vec2 vi = v[i], vj = v[j];
    if (((vi.y > p.y) != (vj.y > p.y)) &&
        (p.x < (vj.x - vi.x) * (p.y - vi.y) / (vj.y - vi.y) + vi.x)) inside = !inside;
  }
  return inside;
}

  bool inside = false;
  for (int i = 0; i < 4; i++){
    int j = (i == 0) ? 3 : i - 1;
    vec2 vi = v[i], vj = v[j];
    if (((vi.y > p.y) != (vj.y > p.y)) &&

    if (distance(p, vec2(0.55,-0.14)) < 0.13) { outColor = vec4(0.90,0.96,1.0,0.95); return; }

}`;

function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh) + '\n' + src);
  return sh;
}
function link(vsSrc, fsSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
function U(p, names) { const o = { p }; for (const n of names) o[n] = gl.getUniformLocation(p, n); return o; }

/* FBO（拖尾累积） */
let fbo, fboTex;
function createFBO() {
  if (fboTex) gl.deleteTexture(fboTex);
  if (fbo) gl.deleteFramebuffer(fbo);
  fboTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, fboTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, canvas.width, canvas.height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fboTex, 0);
  gl.clearColor(BG[0], BG[1], BG[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);

  updateBounds();
}

  instData = new Float32Array(instCapacity * 6);
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  gl.bufferData(gl.ARRAY_BUFFER, instCapacity * 6 * 4, gl.DYNAMIC_DRAW);
}

function buildInstances() {
  const n = fishes.length;
  const wrap = params.wrap;
  const wW = bounds.right - bounds.left;
  const wH = bounds.bottom - bounds.top;

  // 循环模式下，靠近边界的鱼需要在对面补画副本，接口才无缝
  let cap = n;
  if (wrap) {
    cap = 0;
    for (let i = 0; i < n; i++) {
      const f = fishes[i], e = f.size * 2;
      let kx = 1, ky = 1;
      if (f.x - e < bounds.left || f.x + e > bounds.right) kx++;
      if (f.y - e < bounds.top || f.y + e > bounds.bottom) ky++;
      cap += kx * ky;
    }
  }
  ensureInst(cap);

  const d = instData;
  let m = 0;
  for (let i = 0; i < n; i++) {
    const f = fishes[i];
    const ang = Math.atan2(f.vy, f.vx);
    if (!wrap) {
      d[m] = f.x; d[m + 1] = f.y; d[m + 2] = ang;
      d[m + 3] = f.size; d[m + 4] = f.hue; d[m + 5] = f.phase; m += 6;
      continue;
    }
    const e = f.size * 2;
    let sx = 0, hasSx = false;
    if (f.x - e < bounds.left) { sx = 1; hasSx = true; }
    else if (f.x + e > bounds.right) { sx = -1; hasSx = true; }
    let sy = 0, hasSy = false;
    if (f.y - e < bounds.top) { sy = 1; hasSy = true; }
    else if (f.y + e > bounds.bottom) { sy = -1; hasSy = true; }

    // 本体
    d[m] = f.x; d[m + 1] = f.y; d[m + 2] = ang; d[m + 3] = f.size; d[m + 4] = f.hue; d[m + 5] = f.phase; m += 6;
    if (hasSx) { d[m] = f.x + sx * wW; d[m + 1] = f.y; d[m + 2] = ang; d[m + 3] = f.size; d[m + 4] = f.hue; d[m + 5] = f.phase; m += 6; }
    if (hasSy) { d[m] = f.x; d[m + 1] = f.y + sy * wH; d[m + 2] = ang; d[m + 3] = f.size; d[m + 4] = f.hue; d[m + 5] = f.phase; m += 6; }
    if (hasSx && hasSy) { d[m] = f.x + sx * wW; d[m + 1] = f.y + sy * wH; d[m + 2] = ang; d[m + 3] = f.size; d[m + 4] = f.hue; d[m + 5] = f.phase; m += 6; }
  }
  instCount = m / 6;
}
function updateSnow() {
  for (let i = 0; i < snow.length; i++) {
    const p = snow[i];
    p.y += p.vy; if (p.y > H) { p.y = 0; p.x = Math.random() * W; }
    const o = i * 4;
    snowData[o] = p.x; snowData[o + 1] = p.y; snowData[o + 2] = p.r; snowData[o + 3] = p.o;
  }
}

function drawFish(uMag, magCenterX, magCenterY, lensOn, lensCX, lensCY, lensR) {
  gl.useProgram(fishP);
  gl.uniform2f(fishU.u_res, W, H);
  gl.uniform2f(fishU.u_center, W / 2, H / 2);
  gl.uniform1f(fishU.u_zoom, params.zoom);
  gl.uniform2f(fishU.u_magCenter, magCenterX, magCenterY);
  gl.uniform1f(fishU.u_mag, uMag);
  gl.uniform1f(fishU.u_lens, lensOn ? 1 : 0);
  gl.uniform2f(fishU.u_lensCenter, lensCX || 0, lensCY || 0);
  gl.uniform1f(fishU.u_lensR, lensR || 0);
  gl.bindVertexArray(fishVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, instData.subarray(0, instCount * 6));
  gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, instCount);
}

function render() {
  const s = dpr;
  buildInstances();
  updateSnow();

  /* ---- 场景 → FBO（累积拖尾）---- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  gl.useProgram(fadeP);
  gl.uniform4f(fadeU.u_color, BG[0], BG[1], BG[2], FADE_ALPHA);
  gl.bindVertexArray(quadVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 6);

  gl.useProgram(snowP);
  gl.uniform2f(snowU.u_res, W, H);
  gl.uniform1f(snowU.u_dpr, s);
  gl.bindVertexArray(snowVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, snowBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, snowData);
  gl.drawArrays(gl.POINTS, 0, snow.length);

  if (mouse.active && params.mouseField) {
    gl.useProgram(fieldP);
    gl.uniform2f(fieldU.u_resDev, canvas.width, canvas.height);
    gl.uniform2f(fieldU.u_center, mouse.sx * s, canvas.height - mouse.sy * s);
    gl.uniform1f(fieldU.u_radius, params.mRadius * params.zoom * s);
    gl.uniform1f(fieldU.u_repelR, MOUSE_REPEL_RADIUS * params.zoom * s);
    gl.uniform1f(fieldU.u_attract, params.mAttract);
    gl.uniform1f(fieldU.u_repel, params.mRepel);
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
  }

  drawFish(1, 0, 0, false, 0, 0, 0);

  /* ---- 呈现：FBO → 屏幕 ---- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.disable(gl.BLEND);
  gl.useProgram(blitP);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, fboTex);
  gl.uniform1i(blitU.u_tex, 0);
  gl.bindVertexArray(quadVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 6);

  /* ---- 放大镜 ---- */
  if (mag.active && mouse.sx > -9998) {
    const cx = mouse.sx * s, cyGL = canvas.height - mouse.sy * s, R = params.magRadius * s;
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    gl.useProgram(lensP);
    gl.uniform2f(lensU.u_resDev, canvas.width, canvas.height);
    gl.uniform2f(lensU.u_center, cx, cyGL);
    gl.uniform1f(lensU.u_radius, R);
    gl.uniform1f(lensU.u_isRing, 0);
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLES, 0, 6);

    drawFish(params.magZoom, mouse.sx, mouse.sy, true, cx, cyGL, R);

    gl.useProgram(lensP);
    gl.uniform2f(lensU.u_resDev, canvas.width, canvas.height);
    gl.uniform2f(lensU.u_center, cx, cyGL);
    gl.uniform1f(lensU.u_radius, R);
    gl.uniform1f(lensU.u_isRing, 1);
    gl.uniform3f(lensU.u_ringColor, 0.63, 0.88, 1.0);
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
  }

  /* ---- 画笔指示圈 ---- */
  if (paint.enabled && mouse.sx > -9998) {
    const cx = mouse.sx * s, cyGL = canvas.height - mouse.sy * s, R = paint.radius * params.zoom * s;
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(lensP);
    gl.uniform2f(lensU.u_resDev, canvas.width, canvas.height);
    gl.uniform2f(lensU.u_center, cx, cyGL);
    gl.uniform1f(lensU.u_radius, R);
    gl.uniform1f(lensU.u_isRing, 1);
    gl.uniform3f(lensU.u_ringColor, 0.63, 0.88, 1.0);
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
  }

  /* ---- 驱散点 ---- */
  if (scatterPts.length) {
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(lensP);
    gl.uniform2f(lensU.u_resDev, canvas.width, canvas.height);
    gl.uniform1f(lensU.u_isRing, 1);
    gl.bindVertexArray(quadVAO);
    for (let i = 0; i < scatterPts.length; i++) {
      const p = scatterPts[i];
      const wx = W / 2 + (p.x - W / 2) * params.zoom;
      const wy = H / 2 + (p.y - H / 2) * params.zoom;
      const sel = i === selectedSite;
      gl.uniform2f(lensU.u_center, wx * s, canvas.height - wy * s);
      // 中心小圈（始终显示）
      gl.uniform1f(lensU.u_radius, 5 * s);
      gl.uniform3f(lensU.u_ringColor, 1.0, sel ? 0.62 : 0.5, sel ? 0.28 : 0.16);
      gl.drawArrays(gl.TRIANGLES, 0, 6);
      // 选中时（或开启「显示所有半径」时）画影响半径圈
      if (sel || showAllRadii) {
        gl.uniform1f(lensU.u_radius, Math.max(p.r * params.zoom * s, 4));
        gl.uniform3f(lensU.u_ringColor, 1.0, sel ? 0.62 : 0.42, sel ? 0.28 : 0.16);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
      }
    }
  }
  gl.bindVertexArray(null);
}

/* ---------------- 主循环 ---------------- */
(function main() {
  let fpsS = 60, updS = 0, submitS = 0, frameS = 0, frameCount = 0, lastT = performance.now();
  let hiddenPaused = false;
  document.addEventListener('visibilitychange', () => {   // 后台自动暂停；回来重置计时并恢复
    if (document.hidden) {
      if (!paused) { paused = true; hiddenPaused = true; document.body.classList.add('paused'); }
    } else {
      lastT = performance.now();
      if (hiddenPaused) { paused = false; hiddenPaused = false; document.body.classList.remove('paused'); }
    }
  });

  function frame() {
    const frameStart = performance.now();
    const dt = frameStart - lastT; lastT = frameStart;
    const realDt = Math.min(dt / 1000, MAX_DT);
    if (dt > 0) fpsS = fpsS * 0.9 + (1000 / dt) * 0.1;

    updateBounds();
    if (mouse.sx > -9998) {
      const w = screenToWorld(mouse.sx, mouse.sy);
      mouse.x = w.x; mouse.y = w.y;
    }

    let updTotal = 0;
    if (!paused) {
      // 每帧固定 1 个 tick，dt = 真实流逝时间 × 倍速
      const s0 = performance.now();
      update(realDt * speedMul);
      updTotal = performance.now() - s0;
      simTime += realDt * speedMul;
    }
    updS = updS * 0.9 + updTotal * 0.1;
    applyPaint();

    // GPU 计时查询：先读取上一帧结果，再开始这一帧
    if (timerExt && gpuPending) {
      if (gl.getQueryParameter(gpuPending, gl.QUERY_RESULT_AVAILABLE) &&
          !gl.getParameter(timerExt.GPU_DISJOINT_EXT)) {
        gpuMs = gpuMs * 0.8 + (gl.getQueryParameter(gpuPending, gl.QUERY_RESULT) / 1e6) * 0.2;
        gl.deleteQuery(gpuPending); gpuPending = null;
      }
    }
    if (timerExt && !gpuQuery && !gpuPending) {
      gpuQuery = gl.createQuery();
      gl.beginQuery(timerExt.TIME_ELAPSED_EXT, gpuQuery);
    }

    const tr = performance.now();
    render();
    submitS = submitS * 0.9 + (performance.now() - tr) * 0.1;

    if (timerExt && gpuQuery) { gl.endQuery(timerExt.TIME_ELAPSED_EXT); gpuPending = gpuQuery; gpuQuery = null; }

    frameS = frameS * 0.9 + (performance.now() - frameStart) * 0.1;

    if ((frameCount++ % 10) === 0) {
      const upd = paused ? '暂停' : updS.toFixed(2);
      const gpu = timerExt ? gpuMs.toFixed(1) : '—';
      const dtms = realDt * speedMul * 1000;
      const mm = Math.floor(simTime / 60), ss = simTime - mm * 60;
      const clock = mm + ':' + (ss < 10 ? '0' : '') + ss.toFixed(1);
      const lens = [];
      for (const b of neighborGrid.values()) lens.push(b.length);
      lens.sort((a, b) => b - a);
      const avgTop = k => { if (!lens.length) return 0; const m = Math.min(k, lens.length); let s = 0; for (let i = 0; i < m; i++) s += lens[i]; return s / m; };
      const cells = lens.length;
      const avgAll = cells ? fishes.length / cells : 0;
      diagEl.innerHTML =
        `渲染 <b>${submitS.toFixed(1)}</b> · GPU <b>${gpu}</b> · update <b>${upd}</b> ms · 倍速 <b>×${speedMul}</b>` +
        `<br>帧 <b>${frameS.toFixed(1)}</b> · 周期 <b>${(1000 / fpsS).toFixed(1)}</b> · fps <b>${Math.round(fpsS)}</b> · 鱼 <b>${fishes.length}</b>` +
        `<br>逻辑时间 <b>${clock}</b> · tick dt <b>${dtms.toFixed(1)}</b> ms` +
        `<br>格密度 前10/20/50 <b>${avgTop(10).toFixed(1)}</b>/<b>${avgTop(20).toFixed(1)}</b>/<b>${avgTop(50).toFixed(1)}</b> · 均 <b>${avgAll.toFixed(1)}</b> · 格数 <b>${cells}</b>`;
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  spawn(180);
  frame();
})();

function rgbToHue(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255;
  const g = parseInt(hex.slice(3, 5), 16) / 255;
  const b = parseInt(hex.slice(5, 7), 16) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  if (d === 0) return paint.hue;
  let h;
  if (max === r) h = ((g - b) / d) % 6;
  else if (max === g) h = (b - r) / d + 2;
  else h = (r - g) / d + 4;
  h *= 60; if (h < 0) h += 360;
  return h;
}

}

      phase: fishes.map(f => f.phase), wander: fishes.map(f => f.wander),

  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });

}

  document.getElementById('vCount').textContent = Math.round(params.count);
  setS('sScatterR', null, Math.round(1000 * Math.log(params.scatterRadius / SR_MIN) / Math.log(SR_RATIO)), null);
  document.getElementById('vScatterR').textContent = Math.round(params.scatterRadius);
  setS('sZoom', null, Math.round(1000 * Math.log(params.zoom / ZOOM_MIN) / Math.log(ZOOM_RATIO)), null);
  document.getElementById('vZoom').textContent = params.zoom.toFixed(2) + '×';
  document.getElementById('cbMouse').checked = !!params.mouseField;
  document.getElementById('cbWrap').checked = !!params.wrap;
  document.getElementById('cbPaint').checked = !!paint.enabled;
  document.getElementById('sBrush').value = paint.radius;
  document.getElementById('vBrush').textContent = paint.radius;
}
function loadState(data) {
  if (!data) return;
  if (data.params) Object.assign(params, data.params);
  if (data.paint) {
    paint.enabled = !!data.paint.enabled;
    if (typeof data.paint.hue === 'number') paint.hue = data.paint.hue;
    if (typeof data.paint.radius === 'number') paint.radius = data.paint.radius;
    if (data.paint.color) document.getElementById('paintColor').value = data.paint.color;
  }
  if (typeof data.speedIndex === 'number') { speedIdx = Math.max(0, Math.min(SPEEDS.length - 1, data.speedIndex | 0)); speedMul = SPEEDS[speedIdx]; }
  if (typeof data.simTime === 'number') simTime = data.simTime;
  scatterPts.length = 0;
  (data.scatterPts || []).forEach(p => scatterPts.push({ x: +p.x, y: +p.y, r: +p.r, s: +p.s }));
  selectedSite = -1; syncSiteEditor();
  const f = data.fish || {};
  const n = (f.x && f.x.length) || data.count || 0;
  params.count = n;
  fishes = [];
  for (let i = 0; i < n; i++) {
    const o = new Fish();
    o.x = f.x[i]; o.y = f.y[i]; o.vx = f.vx[i]; o.vy = f.vy[i];
    o.size = f.size[i]; o.hue = f.hue[i]; o.phase = f.phase[i];
    if (f.wander) o.wander = f.wander[i];
    fishes.push(o);
  }
  syncUIFromParams();
}
document.getElementById('btnSave').addEventListener('click', saveState);
const loadFileEl = document.getElementById('loadFile');
document.getElementById('btnLoad').addEventListener('click', () => loadFileEl.click());
loadFileEl.addEventListener('change', () => {
  const file = loadFileEl.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = () => { try { loadState(JSON.parse(reader.result)); } catch (e) { alert('载入失败：' + e.message); } loadFileEl.value = ''; };
    reader.readAsText(file);
  }
});

})();
</script>
